<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Первая страница дачного проекта</title>
    <script src="hwrk5.js" defer></script>
    <style>
        :root {
            --main-bg: #f4f1ea;        /* Светло-бежевый фон (под бумагу/дерево) */
            --forest-green: #2d5a3f;   /* Глубокий зеленый цвет леса xxccc*/
            --accent-orange: #7bd433;  /* Цвет костра/дерева для кнопок и акцентов */
            --text-color: #333333;     /* Темно-серый для текста (черный бьет по глазам) */
            --white: #ffffff;
        }

        /* 2. БАЗОВЫЙ СБРОС (Пишут всегда в начале) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Чтобы внутренние отступы не увеличивали ширину блоков */
        }

        html, body {
            height: 100%;
            /* Подключаем системный красивый шрифт без засечек */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color);
            line-height: 1.6; /* Делаем строчки чуть свободнее, чтобы легко читалось */
        }

        #button-container {
            margin-left: 404px;
            margin-top: 40px;

            width: 100px;
            height: 100px;
            border: 4px solid black;
            padding: 30px;
            background-color: #2d5a3f;
        }

        #button-container2 {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 1px solid black;
            background-color: #5a2d2d;
        }
    </style>
</head>
<body>
    <div id="button-container"></div>
    <div id="button-container2"></div>
</body>
</html>
